[project]
name = "call_me_maybe"
version = "1.0.0"
description = "module to optimizing small llm to generate 'Function Calling System'"
requires-python = ">=3.13"
dependencies = [
	"numpy",
	"pydantic",
	"flake8",
	"mypy",
	"llm-sdk",
]

[dependency-groups]
dev = ["flake8", "mypy"]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
