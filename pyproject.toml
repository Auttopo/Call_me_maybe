[project]
name = "call_me_maybe"
version = "1.0.0"
description = "module to optimizing small llm to generate 'Function Calling System'"
requires-python = "==3.13.*"
dependencies = [
	"numpy",
	"pydantic",
	"flake8",
	"mypy",
	"llm-sdk",
	"torch",
	"accelerate",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
